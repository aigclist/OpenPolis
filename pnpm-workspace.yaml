packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts unless they are listed here.
# better-sqlite3 must compile its native binding or the workspace database cannot open.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - msw
  - sharp
  - unrs-resolver
